<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Sertifikat - Upaznet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { upazblue: '#2d3b8e', upazgreen: '#00a651' } } } }
    </script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4 font-sans">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border-t-8 border-upazblue">
        <div class="p-6 text-center border-b border-gray-100 bg-gray-50">
            <h1 class="text-xl font-bold text-upazblue">Sistem Verifikasi Digital</h1>
            <p class="text-xs text-gray-500 mt-1">PT Dimensi Jaringan Bersinar (Upaznet)</p>
        </div>

        <!-- Area Loading -->
        <div id="loadingArea" class="p-10 text-center">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-upazgreen mx-auto mb-4"></div>
            <p class="text-sm text-gray-500 font-semibold">Memverifikasi data...</p>
        </div>

        <!-- Area Valid -->
        <div id="resultArea" class="p-6 hidden">
            <div class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg mb-6 flex items-center shadow-sm">
                <svg class="w-6 h-6 mr-2 text-upazgreen" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="font-bold text-sm">Sertifikat Valid & Resmi</span>
            </div>

            <div class="space-y-4">
                <div class="border-b pb-3">
                    <p class="text-xs text-gray-400 font-bold uppercase tracking-wider mb-1">ID Registrasi</p>
                    <p class="text-lg font-bold text-upazblue" id="resId"></p>
                </div>
                <div class="border-b pb-3">
                    <p class="text-xs text-gray-400 font-bold uppercase tracking-wider mb-1">Nama Peserta</p>
                    <p class="text-md font-bold text-gray-800" id="resNama"></p>
                </div>
                <div class="border-b pb-3">
                    <p class="text-xs text-gray-400 font-bold uppercase tracking-wider mb-1">Asal Institusi</p>
                    <p class="text-sm font-semibold text-gray-700" id="resSekolah"></p>
                </div>
                <div>
                    <p class="text-xs text-gray-400 font-bold uppercase tracking-wider mb-1">Alamat Domisili</p>
                    <p class="text-sm text-gray-600" id="resAlamat"></p>
                </div>
            </div>
        </div>

        <!-- Area Error -->
        <div id="errorArea" class="p-8 text-center hidden">
            <div class="bg-red-50 border border-red-200 text-red-600 p-4 rounded-lg mb-4 inline-block">
                <svg class="w-10 h-10 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <p class="font-bold text-red-600 text-lg mb-1">Tidak Ditemukan</p>
            <p class="text-sm text-gray-500" id="errMsg">ID tidak terdaftar dalam database.</p>
        </div>
    </div>

    <script>
        // GANTI DENGAN URL WEB APP GAS ANDA
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwErMef1Y7De8mBKWfEzxN6nWERokqH0NKURNoz63sng8CT994glnlwZeuvaw2od_3y/exec";

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const idPeserta = urlParams.get('id');

            if (!idPeserta) {
                showError("QR Code tidak valid atau parameter ID hilang.");
                return;
            }

            try {
                const response = await fetch(`${GAS_URL}?id=${idPeserta}`);
                const resData = await response.json();

                if (resData.status === "success") {
                    document.getElementById('resId').innerText = resData.data.idPeserta;
                    document.getElementById('resNama').innerText = resData.data.nama;
                    document.getElementById('resSekolah').innerText = resData.data.asalSekolah;
                    document.getElementById('resAlamat').innerText = resData.data.alamat;
                    
                    document.getElementById('loadingArea').classList.add('hidden');
                    document.getElementById('resultArea').classList.remove('hidden');
                } else {
                    showError(resData.message);
                }
            } catch (error) {
                showError("Gagal terhubung ke server database.");
            }
        };

        function showError(msg) {
            document.getElementById('errMsg').innerText = msg;
            document.getElementById('loadingArea').classList.add('hidden');
            document.getElementById('errorArea').classList.remove('hidden');
        }
    </script>
</body>
</html>
